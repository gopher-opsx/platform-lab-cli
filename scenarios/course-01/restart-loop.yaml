id: restart-loop
name: Catalog Restart Loop
description: >
  Creates a controlled Catalog startup failure that causes
  the container to repeatedly exit and restart.

course: 1
lesson: 31

platform:
  name: platform-lab
  version: "1"

preflight:
  require_healthy:
    - postgres
    - catalog-service

inject:
  - type: apply_restart_loop
    target: catalog-service

verify_failure:
  - type: restart_loop
    target: catalog-service
    expected: restarting

rollback:
  - type: restore_service
    target: catalog-service

verify_recovery:
  - type: service_health
    target: catalog-service
    expected: healthy