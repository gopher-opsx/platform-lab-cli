id: dns-failure
name: Catalog DNS Service Discovery Failure
description: >
  Keeps Catalog configured for the correct PostgreSQL service name while
  breaking DNS resolution inside Catalog from process startup.

course: 1
lesson: 34

platform:
  name: platform-lab
  version: "1"

preflight:
  require_healthy:
    - postgres
    - catalog-service

inject:
  - type: dns_failure
    target: catalog-service

verify_failure:
  - type: service_state
    target: catalog-service
    expected: running
  - type: application_health
    target: catalog-service
    expected: alive
  - type: dependency_readiness
    target: catalog-service
    expected: not_ready

rollback:
  - type: restore_compose_baseline
    target: catalog-service

verify_recovery:
  - type: service_health
    target: catalog-service
    expected: healthy
